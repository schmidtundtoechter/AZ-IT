name: Update main version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version calculation
        run: python -m unittest discover -s tests -v
      - name: Commit version for all new changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/bump_version.py
            if git diff --quiet -- az_it/__init__.py; then
              exit 0
            fi
            git add az_it/__init__.py
            git commit -m 'chore: update app patch version'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Version push failed after three attempts.' >&2
          exit 1
